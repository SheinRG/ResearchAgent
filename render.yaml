# Render Blueprint — backend API + managed Postgres + managed Redis.
# The frontend deploys separately on Vercel (see DEPLOYMENT.md).
#
# In the Render dashboard: New + → "Blueprint" → pick this repo. Render reads
# this file, creates the services, and prompts for the secrets marked
# `sync: false` (GROQ_API_KEY, SERPER_API_KEY, TAVILY_API_KEY, GOOGLE_CLIENT_ID,
# CORS_ORIGINS).

services:
  - type: web
    name: goon-backend
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    # Starter = 512MB. FlashRank + onnxruntime can be tight there, so this
    # blueprint uses the lightweight reranker by default (RERANKER_MODEL below).
    # For the higher-quality MiniLM reranker, move to a >=2GB plan (standard).
    plan: starter
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: GROQ_API_KEY
        sync: false                # paste in dashboard
      - key: SERPER_API_KEY
        sync: false                # paste in dashboard (powers Images + fallback search)
      - key: TAVILY_API_KEY
        sync: false                # paste in dashboard — primary search+read provider
      - key: USE_TAVILY_SEARCH
        value: "true"              # set false to fall back to Serper search + scraping
      - key: AUTH_SECRET
        generateValue: true        # Render generates a strong secret
      - key: GOOGLE_CLIENT_ID
        sync: false                # optional; leave blank to disable Google login
      - key: GROQ_MODEL
        value: llama-3.1-8b-instant
      - key: GROQ_SYNTH_MODEL
        value: llama-3.3-70b-versatile
      # Lightweight reranker so the service fits a small instance. Remove this
      # (or set to ms-marco-MiniLM-L-12-v2) on a >=2GB plan for better ranking.
      - key: RERANKER_MODEL
        value: ms-marco-TinyBERT-L-2-v2
      - key: RATE_LIMIT_PER_HOUR
        value: "30"
      - key: ENVIRONMENT
        value: production
      # Optional error tracking. Leave blank to disable; paste a Sentry DSN to enable.
      - key: SENTRY_DSN
        sync: false
      # MUST include your Vercel URL(s) as a JSON array, e.g.
      #   ["https://your-app.vercel.app"]
      - key: CORS_ORIGINS
        sync: false
      # Supabase Postgres — paste in the dashboard. Render's own free Postgres
      # is a 30-day trial that expires and is deleted, so it is not used here.
      #
      # Use Supabase's SESSION pooler URI (Connect → Session pooler):
      #   postgresql://postgres.<ref>:<pw>@aws-0-<region>.pooler.supabase.com:5432/postgres
      # NOT the direct db.<ref>.supabase.co host (IPv6-only, unreachable from
      # Render) and NOT the transaction pooler on :6543 (breaks asyncpg's
      # prepared-statement cache).
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        fromService:
          type: redis
          name: goon-redis
          property: connectionString

  # Redis is optional — the app degrades gracefully (no cache / no rate limit)
  # if it's absent. Wiring it here just enables both.
  - type: redis
    name: goon-redis
    plan: free
    maxmemoryPolicy: allkeys-lru
    ipAllowList: []                # internal-only access

# No `databases:` block on purpose. Render's free Postgres expires after 30 days
# and is then deleted; Postgres is hosted on Supabase instead and wired in via
# the DATABASE_URL secret above.
